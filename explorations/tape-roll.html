<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jeffols duct-tape roll</title>
<style>
  body{margin:0;background:#0b0e16;color:#e8eaf0;font:15px/1.5 -apple-system,sans-serif;padding:32px;}
  h1{font-size:19px;margin:0 0 6px;}
  p.sub{color:#8b93a7;margin:0 0 24px;max-width:640px;}
  .row{display:flex;flex-wrap:wrap;gap:24px;}
  .card{background:#141924;border-radius:16px;padding:16px;}
  .card .t{font-size:13px;font-weight:600;margin:0 0 10px;text-align:center;}
  svg{display:block;}
</style></head>
<body>
<h1>jeffols duct-tape roll — playground</h1>
<p class="sub">Icon lives on the core sticker; a flap peels off and lays a trail. Duct silver =
sheen gradient + cross-weave (the treatment that read as duct tape).</p>
<div class="row" id="app"></div>
<script>
const BG="#111827", GL="#FFD60A";
function glyph(fill){
  return `<rect x="400" y="120" width="140" height="140" rx="70" fill="${fill}"/>
    <rect x="460" y="340" width="160" height="280" rx="6" fill="${fill}"/>
    <path d="M 500 640 H 660 V 720 Q 660 860 520 860 H 370 Q 280 860 280 780 V 750
      Q 280 710 330 710 H 410 Q 500 710 500 640 Z" fill="${fill}"/>`;
}
// shared defs
function defs(id){return `<defs>
  <linearGradient id="silver${id}" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#D2D6DC"/><stop offset="0.5" stop-color="#AEB4BD"/>
    <stop offset="1" stop-color="#868D97"/></linearGradient>
  <radialGradient id="rim${id}" cx="0.4" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#E4E7EB"/><stop offset="0.7" stop-color="#AEB4BD"/>
    <stop offset="1" stop-color="#7C838D"/></radialGradient>
  <pattern id="weave${id}" width="14" height="14" patternUnits="userSpaceOnUse">
    <path d="M0 0 L14 14 M0 14 L14 0" stroke="#000" stroke-width="0.8" opacity="0.10"/></pattern>
  <radialGradient id="core${id}" cx="0.42" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#C8A97A"/><stop offset="1" stop-color="#9A7C4F"/></radialGradient>
  <filter id="sh${id}" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>`;}

function sticker(cx,cy,r){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#0b0e16"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${GL}" stroke-width="${r*0.06}"/>
    <svg x="${cx-r*0.72}" y="${cy-r*0.72}" width="${r*1.44}" height="${r*1.44}" viewBox="0 0 1024 1024">
      <g transform="translate(28,16)">${glyph(GL)}</g></svg>`;
}

// face-on roll: tape band + winding lines + kraft core + sticker
function roll(id,cx,cy,R){
  const band=R*0.42, rIn=R-band, coreOut=rIn, coreIn=coreOut*0.66, stR=coreIn*1.02;
  let winds="";
  for(let i=1;i<9;i++){const rr=rIn+band*i/9;
    winds+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#000" stroke-width="1.2" opacity="0.10"/>`;}
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#rim${id})"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#weave${id})"/>
    ${winds}
    <circle cx="${cx}" cy="${cy}" r="${rIn}" fill="url(#core${id})"/>
    <circle cx="${cx}" cy="${cy}" r="${rIn}" fill="none" stroke="#000" stroke-width="2" opacity="0.15"/>
    ${sticker(cx,cy,stR)}`;
}

// peeling strip + trail (a textured ribbon leaving the right edge)
function trail(id,path,shine){
  return `<path d="${path}" fill="url(#silver${id})"/>
    <path d="${path}" fill="url(#weave${id})"/>
    <path d="${shine}" stroke="#fff" stroke-width="5" opacity="0.30" fill="none"/>`;
}

function scene(id,trailPath,shinePath,shadowPath){
  const cx=340,cy=340,R=260;
  return `<svg width="760" height="600" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg">
    ${defs(id)}
    <ellipse cx="${cx}" cy="${cy+R*0.98}" rx="${R*0.9}" ry="30" fill="#000" opacity="0.35"/>
    ${shadowPath?`<path d="${shadowPath}" fill="#000" opacity="0.28"/>`:""}
    <g filter="url(#sh${id})">${trail(id,trailPath,shinePath)}</g>
    <g filter="url(#sh${id})">${roll(id,cx,cy,R)}</g>
  </svg>`;
}

// Take A — trail off to the right, gentle S
const A_trail="M 578 210 C 700 170, 830 190, 900 150 L 900 470 C 820 430, 700 470, 585 470 "+
  "C 640 400, 640 300, 578 210 Z";
const A_shine="M 600 240 C 700 210, 820 225, 895 195";
// Take B — flap peels UP over the top, curls, trails down-right
const B_trail="M 470 90 C 520 30, 640 20, 720 60 C 660 90, 700 150, 780 170 "+
  "C 700 210, 560 200, 500 250 C 470 190, 470 140, 470 90 Z";
const B_shadow="M 470 110 C 520 60, 620 55, 690 85 C 620 110, 560 160, 520 210 Z";
const B_shine="M 500 110 C 560 70, 650 70, 705 100";

const app=document.getElementById("app");
app.innerHTML=`
  <div class="card"><div class="t">Take A — trail off to the right</div>${scene("a",A_trail,A_shine,null)}</div>
  <div class="card"><div class="t">Take B — flap peeled up over the top</div>${scene("b",B_trail,B_shine,B_shadow)}</div>
`;
</script>
</body></html>
