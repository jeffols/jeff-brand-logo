<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jeffols tape roll — forward trail</title>
<style>
  body{margin:0;font:15px/1.5 -apple-system,sans-serif;}
  .sec{padding:28px 32px;}
  .dark{background:#0b0e16;color:#e8eaf0;}
  .light{background:#eef0f3;color:#111827;}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin:0 0 6px;}
  .sub{opacity:.6;font-size:13px;margin:0 0 18px;}
</style></head>
<body>
<script>
const BG="#111827", GL="#FFD60A";
function glyph(fill){return `<rect x="400" y="120" width="140" height="140" rx="70" fill="${fill}"/>
  <rect x="460" y="340" width="160" height="280" rx="6" fill="${fill}"/>
  <path d="M 500 640 H 660 V 720 Q 660 860 520 860 H 370 Q 280 860 280 780 V 750
    Q 280 710 330 710 H 410 Q 500 710 500 640 Z" fill="${fill}"/>`;}

function defs(id){return `<defs>
  <radialGradient id="rim${id}" cx="0.4" cy="0.32" r="0.8">
    <stop offset="0" stop-color="#E6E9ED"/><stop offset="0.7" stop-color="#AEB4BD"/>
    <stop offset="1" stop-color="#79808A"/></radialGradient>
  <linearGradient id="strip${id}" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#9CA3AD"/><stop offset="0.45" stop-color="#C6CBD1"/>
    <stop offset="1" stop-color="#B0B6BE"/></linearGradient>
  <pattern id="weave${id}" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M0 0 L16 16 M0 16 L16 0" stroke="#000" stroke-width="0.9" opacity="0.10"/></pattern>
  <radialGradient id="core${id}" cx="0.42" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#C8A97A"/><stop offset="1" stop-color="#9A7C4F"/></radialGradient>
  <filter id="soft${id}" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.40"/></filter>
</defs>`;}

function sticker(cx,cy,r){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#0b0e16"/>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${GL}" stroke-width="${r*0.06}"/>
  <svg x="${cx-r*0.72}" y="${cy-r*0.72}" width="${r*1.44}" height="${r*1.44}" viewBox="0 0 1024 1024">
    <g transform="translate(28,16)">${glyph(GL)}</g></svg>`;}

function roll(id,cx,cy,R){
  const band=R*0.42, rIn=R-band;
  let winds="";
  for(let i=1;i<10;i++){const rr=rIn+band*i/10;
    winds+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#000" stroke-width="1.1" opacity="0.09"/>`;}
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#rim${id})"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#weave${id})"/>${winds}
    <circle cx="${cx}" cy="${cy}" r="${rIn}" fill="url(#core${id})"/>
    <circle cx="${cx}" cy="${cy}" r="${rIn}" fill="none" stroke="#000" stroke-width="2" opacity="0.15"/>
    ${sticker(cx,cy,rIn*0.72)}`;
}

// forward trail: trapezoid feeding under roll to the viewer, torn near end
function forwardTrail(id){
  const fy=498, ny=724;              // far / near y
  const fL=372, fR=528;              // far edge x
  const nL=306, nR=594;              // near edge x (wider = closer)
  // torn near edge zigzag
  const jag=[]; const segs=9;
  for(let i=0;i<=segs;i++){const t=i/segs; const x=nL+(nR-nL)*t;
    jag.push(`${x.toFixed(0)} ${(ny+((i%2)?14:-6)).toFixed(0)}`);}
  const body=`M ${fL} ${fy} L ${fR} ${fy} L ${nR} ${ny} L ${jag.reverse().join(" L ")} L ${nL} ${ny} Z`;
  // lengthwise ridges (a few faint bands across, wider apart toward viewer)
  let ridges="";
  const ys=[0.30,0.56,0.80];
  for(const t of ys){const y=fy+(ny-fy)*t;
    const lx=fL+(nL-fL)*t, rx=fR+(nR-fR)*t;
    ridges+=`<line x1="${lx}" y1="${y}" x2="${rx}" y2="${y}" stroke="#000" stroke-width="2" opacity="0.08"/>`;}
  // leading lifted edge highlight (where it exits under the roll)
  const lead=`<line x1="${fL+6}" y1="${fy-1}" x2="${fR-6}" y2="${fy-1}" stroke="#fff" stroke-width="4" opacity="0.5"/>`;
  // center sheen down the length
  const sheen=`<path d="M ${(fL+fR)/2-26} ${fy} L ${(fL+fR)/2+26} ${fy} L ${(nL+nR)/2+40} ${ny}
     L ${(nL+nR)/2-40} ${ny} Z" fill="#fff" opacity="0.14"/>`;
  return `<clipPath id="tc${id}"><path d="${body}"/></clipPath>
    <path d="${body}" fill="url(#strip${id})"/>
    <g clip-path="url(#tc${id})">
      <rect x="280" y="480" width="340" height="280" fill="url(#weave${id})"/>
      ${sheen}${ridges}</g>
    ${lead}`;
}

function scene(id){
  const cx=450,cy=286,R=232;
  return `<svg width="520" height="470" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
    ${defs(id)}
    <ellipse cx="${cx}" cy="560" rx="${R*0.92}" ry="34" fill="#000" opacity="0.32"/>
    <ellipse cx="450" cy="716" rx="150" ry="26" fill="#000" opacity="0.22"/>
    ${forwardTrail(id)}
    <g filter="url(#soft${id})">${roll(id,cx,cy,R)}</g>
  </svg>`;
}
for(const [bg,label] of [["dark","On dark"],["light","On light"]]){
  document.write(`<div class="sec ${bg}"><h2>${label}</h2>
    <div class="sub">Forward trail — tape feeds under the roll and lays flat toward you, torn end.</div>
    ${scene(bg)}</div>`);
}
</script>
</body></html>
