<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does silver read as duct tape?</title>
<style>
  body{margin:0;font:15px/1.5 -apple-system,sans-serif;}
  .sec{padding:30px 36px;}
  .light{background:#f5f6f8;color:#111827;}
  .dark{background:#0b0e16;color:#e8eaf0;}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:0 0 16px;}
  .lbl{font-size:12px;opacity:.6;margin:18px 0 6px;}
  svg{display:block;}
</style></head>
<body>
<script>
const W=760,H=92;
function torn(id,fill,extra=""){
  const step=20,jit=6,top=[],bot=[],y=18,h=52,x=20,w=W-40;
  for(let px=x;px<=x+w;px+=step)top.push([px,y+(Math.sin(px*0.7+id)*jit)]);
  for(let px=x+w;px>=x;px-=step)bot.push([px,y+h+(Math.cos(px*0.6+id)*jit)]);
  const pts=[...top,...bot];
  const d="M "+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")+" Z";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#CDD1D7"/><stop offset="0.5" stop-color="#AEB4BD"/>
        <stop offset="1" stop-color="#8D949E"/></linearGradient>
      <pattern id="weave${id}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
        <path d="M0 0 L10 10 M0 10 L10 0" stroke="#000" stroke-width="0.6" opacity="0.12"/>
      </pattern>
      <clipPath id="c${id}"><path d="${d}"/></clipPath>
    </defs>
    <path d="${d}" fill="${fill}"/>
    <g clip-path="url(#c${id})">${extra}</g>
    <rect x="${x}" y="26" width="${w}" height="4" fill="#fff" opacity="0.35" clip-path="url(#c${id})"/>
    <text x="${W/2}" y="52" text-anchor="middle" fill="#1b2230" font-size="26" font-weight="800"
      letter-spacing="1" font-family="-apple-system,sans-serif">THE DUCT TAPE OF ENGINEERING</text>
  </svg>`;
}
const flat = torn(1,"#AEB6C2");
const sheen = torn(2,"url(#g2)");
const full = torn(3,"url(#g3)",`<rect x="0" y="0" width="${W}" height="${H}" fill="url(#weave3)"/>`);

for(const bg of ["light","dark"]){
  document.write(`<div class="sec ${bg}"><h2>${bg} background</h2>
    <div class="lbl">1 · flat gray (current) — reads generic / redaction-bar risk</div>${flat}
    <div class="lbl">2 · + metallic sheen gradient — reads metallic tape</div>${sheen}
    <div class="lbl">3 · + sheen + cross-weave — reads specifically duct tape</div>${full}
  </div>`);
}
</script>
</body></html>
