<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Banner Comparison — on LinkedIn background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #F4F2EE;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 2rem;
    color: #333;
  }
  h1 { font-size: 1.1rem; font-weight: 500; margin-bottom: 2rem; color: #666; }
  .option { margin-bottom: 3rem; }
  .option h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 0.75rem; }
  .card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    max-width: 900px;
  }
  .card img {
    width: 100%;
    display: block;
  }
  .profile-area {
    position: relative;
    height: 80px;
    padding: 0 24px;
  }
  .avatar {
    position: absolute;
    top: -60px;
    left: 24px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: #ddd;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name {
    position: absolute;
    left: 160px;
    top: 12px;
    font-size: 1.2rem;
    font-weight: 600;
    color: #191919;
  }
  .headline {
    position: absolute;
    left: 160px;
    top: 38px;
    font-size: 0.8rem;
    color: #666;
  }
</style>
</head>
<body>
<h1>LinkedIn banner comparison — shown against actual page background (#F4F2EE)</h1>

<div class="option">
  <h2>A — Dark (phosphor glow)</h2>
  <div class="card">
    <img src="linkedin-banner-dark.png" alt="dark banner">
    <div class="profile-area">
      <div class="avatar"><div style="width:100%;height:100%;background:#bbb;"></div></div>
      <div class="name">Jeff Olsen</div>
      <div class="headline">Distinguished Engineer</div>
    </div>
  </div>
</div>

<div class="option">
  <h2>B — Light (blueprint traces)</h2>
  <div class="card">
    <img src="linkedin-banner-light.png" alt="light banner">
    <div class="profile-area">
      <div class="avatar"><div style="width:100%;height:100%;background:#bbb;"></div></div>
      <div class="name">Jeff Olsen</div>
      <div class="headline">Distinguished Engineer</div>
    </div>
  </div>
</div>

</body>
</html>
