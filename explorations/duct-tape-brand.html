<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duct tape of engineering — brand showcase</title>
<style>
  body { margin:0; background:#0b0e16; color:#e8eaf0;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:36px; }
  h1 { font-size:20px; margin:0 0 24px; }
  h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:#8b93a7;
    margin:36px 0 14px; border-bottom:1px solid #222836; padding-bottom:8px; }
  .row { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  .card { background:#141924; border-radius:16px; padding:18px; display:flex;
    flex-direction:column; align-items:center; }
  .card .t { font-size:13px; margin:0 0 2px; font-weight:600; }
  .card .d { color:#8b93a7; font-size:11px; text-align:center; margin:0 0 10px; max-width:200px; }
  svg { display:block; }
  .chip { width:120px; height:64px; border-radius:10px; display:flex; align-items:flex-end;
    padding:8px; font-size:11px; font-weight:600; }
</style>
</head>
<body>
<h1>"The duct tape of engineering" — brand exploration</h1>
<div id="app"></div>

<script>
const BG="#111827", GL="#FFD60A", TAPE="#AEB6C2", TAPED="#7E8794", INK="#111827";

function glyph(fill){
  return `<rect x="400" y="120" width="140" height="140" rx="70" fill="${fill}"/>
    <rect x="460" y="340" width="160" height="280" rx="6" fill="${fill}"/>
    <path d="M 500 640 H 660 V 720 Q 660 860 520 860 H 370 Q 280 860 280 780 V 750
      Q 280 710 330 710 H 410 Q 500 710 500 640 Z" fill="${fill}"/>`;
}
function icon(inner, sz){
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <rect width="1024" height="1024" rx="174" fill="${BG}"/>
    <rect x="400" y="120" width="140" height="140" rx="70" fill="${GL}"/>
    ${inner}
    <path d="M 500 640 H 660 V 720 Q 660 860 520 860 H 370 Q 280 860 280 780 V 750
      Q 280 710 330 710 H 410 Q 500 710 500 640 Z" fill="${GL}"/>
  </svg>`;
}
// torso finalists
const bandsTorso = [[340,64,-16],[412,64,14],[484,64,-10],[556,64,12]]
  .map(([y,h,dx])=>`<rect x="${460+dx}" y="${y}" width="160" height="${h}" rx="8" fill="${GL}"/>`).join("");
const patchTorso = `<clipPath id="stemclip"><rect x="460" y="340" width="160" height="280" rx="6"/></clipPath>
  <rect x="460" y="340" width="160" height="280" rx="6" fill="${GL}"/>
  <g clip-path="url(#stemclip)" transform="rotate(-18 540 486)">
    <rect x="360" y="452" width="360" height="72" fill="${TAPE}"/>
    <rect x="360" y="452" width="360" height="11" fill="${TAPED}"/>
  </g>`;

// torn duct-tape strip (browser JS: Math.random ok here)
function tornStrip(x,y,w,h,fill,rot){
  const step=22, jit=7, top=[], bot=[];
  for(let px=x; px<=x+w; px+=step){ top.push([px, y+(Math.random()*jit-jit/2)]); }
  for(let px=x+w; px>=x; px-=step){ bot.push([px, y+h+(Math.random()*jit-jit/2)]); }
  const pts=[...top,...bot];
  const d="M "+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L ")+" Z";
  const shineY=y+h*0.28;
  return `<g transform="rotate(${rot} ${x+w/2} ${y+h/2})">
    <path d="${d}" fill="${fill}"/>
    <rect x="${x}" y="${shineY}" width="${w}" height="${h*0.10}" fill="#ffffff" opacity="0.18"/>
    <rect x="${x}" y="${y+h*0.62}" width="${w}" height="${h*0.06}" fill="#000000" opacity="0.12"/>
  </g>`;
}

/* ---- render ---- */
const app=document.getElementById("app");
function card(title,desc,svg){ return `<div class="card"><div class="t">${title}</div>
  <div class="d">${desc}</div>${svg}</div>`; }

// SECTION 1 — torso finalists
app.innerHTML += `<h2>1 · Torso easter egg — the two survivors</h2><div class="row">
  ${card("Reference","current clean stem", icon(`<rect x="460" y="340" width="160" height="280" rx="6" fill="${GL}"/>`,190))}
  ${card("Offset bands","tectonic-grammar wrap; my pick", icon(bandsTorso,190))}
  ${card("Repair patch (clipped)","tape strip clipped inside the stem", icon(patchTorso,190))}
  <div class="card"><div class="t">at 34px</div><div class="d">both collapse clean</div>
    <div style="display:flex;gap:12px">${icon(bandsTorso,34)}${icon(patchTorso,34)}</div></div>
</div>`;

// SECTION 2 — tagline lockups
function lockup(tag, w=440){
  return `<svg width="${w}" height="120" viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg">
    <svg x="8" y="10" width="100" height="100" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="174" fill="${BG}"/>${glyph(GL)}</svg>
    <text x="124" y="52" fill="#e8eaf0" font-family="-apple-system,sans-serif"
      font-size="34" font-weight="700">jeffols</text>
    <text x="126" y="82" fill="${GL}" font-family="-apple-system,sans-serif"
      font-size="16" font-weight="600" letter-spacing="0.5">${tag}</text>
  </svg>`;
}
app.innerHTML += `<h2>2 · Tagline lockup</h2><div class="row">
  ${card("Option A","", lockup("the duct tape of engineering"))}
  ${card("Option B","", lockup("fixes anything."))}
</div>`;

// SECTION 3 — patch sticker (decorative, silhouette-breaking ok)
function sticker(){
  return `<svg width="220" height="220" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <circle cx="512" cy="512" r="470" fill="${GL}"/>
    <circle cx="512" cy="512" r="470" fill="none" stroke="${BG}" stroke-width="26"/>
    <g transform="translate(70,60) scale(0.86)">${glyph(BG)}</g>
    ${tornStrip(120,650,784,150,TAPE,-8)}
    <text x="512" y="740" text-anchor="middle" fill="${INK}" font-family="-apple-system,sans-serif"
      font-size="86" font-weight="800" letter-spacing="2" transform="rotate(-8 512 725)">FIXES ANYTHING</text>
  </svg>`;
}
app.innerHTML += `<h2>3 · Patch sticker / badge</h2><div class="row">
  ${card("Sticker","torn tape + tagline; decorative, not the favicon", sticker())}
</div>`;

// SECTION 4 — duct-tape banner accent
function banner(){
  const W=900,H=260;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="${BG}"/>
    <svg x="60" y="70" width="120" height="120" viewBox="0 0 1024 1024">
      <rect width="1024" height="1024" rx="174" fill="#0b0e16"/>${glyph(GL)}</svg>
    <text x="210" y="120" fill="#e8eaf0" font-family="-apple-system,sans-serif" font-size="44" font-weight="700">Jeff Olsen</text>
    ${tornStrip(210,150,520,66,TAPE,-2)}
    <text x="250" y="192" fill="${INK}" font-family="-apple-system,sans-serif" font-size="30" font-weight="800" letter-spacing="1">THE DUCT TAPE OF ENGINEERING</text>
  </svg>`;
}
app.innerHTML += `<h2>4 · Banner accent (torn tape strip)</h2><div class="row">${card("LinkedIn-style banner","",banner())}</div>`;

// SECTION 5 — accent color system
app.innerHTML += `<h2>5 · Silver as a secondary accent color</h2><div class="row">
  <div class="chip" style="background:${GL};color:${INK}">Signal Yellow<br>#FFD60A</div>
  <div class="chip" style="background:${BG};color:#fff">Ink Navy<br>#111827</div>
  <div class="chip" style="background:${TAPE};color:${INK}">Duct Silver<br>#AEB6C2</div>
  <div class="card"><div class="t">torn-tape divider</div><div class="d">section break / watermark</div>
    <svg width="300" height="60" viewBox="0 0 300 60">${tornStrip(10,18,280,26,TAPE,0)}</svg></div>
</div>`;
</script>
</body>
</html>
